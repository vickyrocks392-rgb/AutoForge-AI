# AutoForge AI — Local Development
# =============================================
# This Docker Compose file provides infrastructure services for local development.
# Application services will be added as they are implemented.
# Uses official default images with no custom configuration.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: autoforge
      POSTGRES_PASSWORD: autoforge
      POSTGRES_DB: autoforge
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: