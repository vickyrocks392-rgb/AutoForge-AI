[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoforge-event-platform"
version = "1.0.0"
description = "Event Platform for AutoForge AI OS — implements Event Platform Specification v1.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AutoForge AI" }
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autoforge_event_platform"]

[tool.hatch.build.targets.sdist]
include = ["src/autoforge_event_platform", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
